<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index.css</title>
    <style>
        /* ==== index.css ==== */
        :root {
          --primary: #2c3e50;
          --accent: #e74c3c;
          --bg: #f4f7f6;
          --text: #333;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: var(--bg);
          color: var(--text);
          line-height: 1.6;
        }

        nav {
          background: var(--primary);
          padding: 0.8rem 1.5rem;
        }

        nav ul {
          list-style: none;
          display: flex;
          gap: 1.5rem;
        }

        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: 500;
          transition: color 0.2s;
        }

        nav a:hover {
          color: var(--accent);
        }

        .container {
          max-width: 800px;
          margin: 2rem auto;
          padding: 0 1rem;
        }

        h1 {
          margin-bottom: 0.5rem;
        }

        p {
          margin-bottom: 1rem;
        }

        footer {
          text-align: center;
          padding: 2rem;
          font-size: 0.9rem;
          color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>index.css</h1>
        <p>This page contains the CSS rules that were originally in index.css.</p>
    </div>
</body>
</html>
